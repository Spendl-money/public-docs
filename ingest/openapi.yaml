openapi: 3.0.3
info:
  title: Spendl Ingest API
  version: 1.0.0
  description: |
    Public API for ingesting and validating users in Spendl. 
    Authentication uses API key/secret exchange for a Bearer JWT with scopes for authorization control.
servers:
  - url: https://ingest.spendl.money
    description: Production
  - url: https://ingest.staging.spendl.money
    description: Staging
  - url: http://localhost:3000
    description: Local
security:
  - {}
tags:
  - name: Auth
  - name: Ingestor
  - name: KYC
  - name: Debt
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code, type]
          properties:
            message:
              type: string
            code:
              type: integer
            type:
              type: string
    ApiKeyCreateRequest:
      type: object
      properties:
        scopes:
          type: array
          items:
            type: string
          default: [read, write]
        expiresInDays:
          type: integer
          minimum: 1
        label:
          type: string
          maxLength: 100
    ApiKeyCreateResponse:
      type: object
      required: [apiKeyId, apiKey, apiSecret, scopes, warning]
      properties:
        apiKeyId:
          type: string
        apiKey:
          type: string
        apiSecret:
          type: string
        scopes:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
        label:
          type: string
          nullable: true
        warning:
          type: string
    TokenRequest:
      type: object
      required: [apiKey, apiSecret]
      properties:
        apiKey:
          type: string
        apiSecret:
          type: string
    TokenResponse:
      type: object
      required: [accessToken, expiresIn, tokenType]
      properties:
        accessToken:
          type: string
          description: Bearer JWT
        expiresIn:
          type: integer
          description: Expiry in seconds
        tokenType:
          type: string
          enum: [Bearer]
    EmailPreferences:
      type: object
      properties:
        login: { type: boolean }
        deposit: { type: boolean }
        trade: { type: boolean }
        topup: { type: boolean }
    Preferences:
      type: object
      properties:
        email: { $ref: '#/components/schemas/EmailPreferences' }
        twoFactor: { type: boolean }
        updatedAt: { type: string, format: date-time }
    UserDetails:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        password: { type: string, nullable: true }
        emailConfirmation: { type: string, nullable: true }
        status:
          type: string
          enum: [active, inactive, suspended, pending]
          default: pending
    S3Keys:
      type: object
      description: |
        KYC document upload history per document type. Each document type contains an array
        of upload records with full history. Retrieve the latest upload via array.at(-1).
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/KycUpload'
      properties:
        idProofFront:
          type: array
          items:
            $ref: '#/components/schemas/KycUpload'
        idProofBack:
          type: array
          items:
            $ref: '#/components/schemas/KycUpload'
        passportProof:
          type: array
          items:
            $ref: '#/components/schemas/KycUpload'
        permitProof:
          type: array
          items:
            $ref: '#/components/schemas/KycUpload'
        proofOfResidence:
          type: array
          items:
            $ref: '#/components/schemas/KycUpload'
    KycUpload:
      type: object
      description: A single KYC document upload record with attribution
      required:
        - s3Key
        - uploadedByApiKeyId
        - uploadedAt
      properties:
        s3Key:
          type: string
          description: S3 key path where the document is stored
        uploadedByApiKeyId:
          type: string
          description: API key ID that uploaded this document (read-only, auto-populated)
        uploadedByTenant:
          type: string
          nullable: true
          description: Tenant identifier (from API key label) that uploaded this document (read-only, auto-populated)
        uploadedAt:
          type: string
          format: date-time
          description: Timestamp when the document was uploaded
    KycData:
      type: object
      additionalProperties: true
      properties:
        productType: { type: string }
        email: { type: string, format: email }
        altEmail: { type: string, nullable: true }
        title: { type: string }
        name: { type: string }
        surname: { type: string }
        dob: { type: string }
        gender: { type: string }
        nationality: { type: string }
        languageIndicator: { type: string }
        phone: { type: string }
        altPhone: { type: string }
        suitableContactTime: { type: string }
        residenceIndicator: { type: string }
        residenceCountry: { type: string }
        identityType: { type: string }
        idNumber: { type: string }
        idIssue: { type: string }
        idExpiry: { type: string, nullable: true }
        identityIssueCountry: { type: string }
        idProofFrontFile: { type: string, nullable: true }
        idProofBackFile: { type: string, nullable: true }
        passportProofFile: { type: string, nullable: true }
        permitType: { type: string }
        permitNumber: { type: string }
        permitIssue: { type: string }
        permitExpiry: { type: string }
        permitProofFile: { type: string, nullable: true }
        idProofFile: { type: string, nullable: true }
        pepPip: { type: string }
        streetNumber: { type: string }
        addressLine1: { type: string }
        addressLine2: { type: string }
        suburb: { type: string }
        city: { type: string }
        province: { type: string }
        postalCode: { type: string }
        country: { type: string }
        addressType: { type: string }
        proofOfResidenceFile: { type: string, nullable: true }
        residenceStatus: { type: string }
        samePostal: { type: boolean }
        postalAddress: { type: string, nullable: true }
        company: { type: string }
        employeeId: { type: string }
        employmentStatus: { type: string }
        sourceOfFunds: { type: string }
        intendedPurposeOfAccount: { type: string }
        tncAccepted: { type: boolean }
        tncAcceptedAt: { type: string }
    KycDetails:
      type: object
      properties:
        status:
          type: string
          enum: [Not Started, Pending, Approved, Rejected]
        rejectionReason: { type: string }
        kycData: { $ref: '#/components/schemas/KycData' }
        s3Keys: { $ref: '#/components/schemas/S3Keys' }
    ScreeningHistoryEntry:
      type: object
      properties:
        status: { type: string }
        date: { type: string, format: date-time }
        notes: { type: string }
        screenedBy: { type: string, nullable: true }
    ComplianceDetails:
      type: object
      properties:
        screeningStatus:
          type: string
          enum: [pending, cleared, flagged, review]
        screeningDate: { type: string, format: date-time, nullable: true }
        screeningNotes: { type: string }
        screenedBy: { type: string, nullable: true }
        flagReason: { type: string, nullable: true }
        screeningHistory:
          type: array
          items: { $ref: '#/components/schemas/ScreeningHistoryEntry' }
    CardsDetails:
      type: object
      properties:
        subAccountId: { type: string, nullable: true }
        label: { type: string, nullable: true }
        depositAddresses:
          type: object
          additionalProperties: { type: string }
        depositTags:
          type: object
          additionalProperties: { type: string }
        cardIds:
          type: array
          items: { type: string }
        depositAddressesFetchedAt: { type: number }
    DepositDetail:
      type: object
      properties:
        currency: { type: string }
        amount: { type: number }
        address: { type: string }
        transactionHash: { type: string, nullable: true }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TradeDetail:
      type: object
      properties:
        orderId: { type: string }
        pair: { type: string }
        side: { type: string, enum: [buy, sell] }
        amount: { type: number }
        price: { type: number }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WithdrawalDetail:
      type: object
      properties:
        valrWithdrawalId: { type: string }
        currency: { type: string }
        amount: { type: number }
        address: { type: string }
        networkType: { type: string }
        feeAmount: { type: number }
        transactionHash: { type: string, nullable: true }
        confirmations: { type: number }
        lastConfirmationAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        verified: { type: boolean }
        status: { type: string, enum: [Pending, Processing, Complete, Failed, Cancelled] }
        source: { type: string }
        updatedAt: { type: string, format: date-time }
    User:
      type: object
      properties:
        _id: { type: string }
        userDetails: { $ref: '#/components/schemas/UserDetails' }
        kycDetails: { $ref: '#/components/schemas/KycDetails' }
        complianceDetails: { $ref: '#/components/schemas/ComplianceDetails' }
        cardsDetails: { $ref: '#/components/schemas/CardsDetails' }
        depositDetails:
          type: array
          items: { $ref: '#/components/schemas/DepositDetail' }
        tradeDetails:
          type: array
          items: { $ref: '#/components/schemas/TradeDetail' }
        preferences: { $ref: '#/components/schemas/Preferences' }
        withdrawalDetails:
          type: array
          items: { $ref: '#/components/schemas/WithdrawalDetail' }
        createdByApiKeyId:
          type: string
          description: API key ID that created this user (read-only, auto-populated)
        createdByTenant:
          type: string
          nullable: true
          description: Tenant identifier (from API key label) that created this user (read-only, auto-populated)
        clientNo:
          type: string
          nullable: true
          description: External client reference number (from TaskFlow), used to link debt obligations
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserInput:
      type: object
      required: [userDetails]
      properties:
        userDetails: { $ref: '#/components/schemas/UserDetails' }
        kycDetails: { $ref: '#/components/schemas/KycDetails' }
        complianceDetails: { $ref: '#/components/schemas/ComplianceDetails' }
        cardsDetails: { $ref: '#/components/schemas/CardsDetails' }
        depositDetails:
          type: array
          items: { $ref: '#/components/schemas/DepositDetail' }
        tradeDetails:
          type: array
          items: { $ref: '#/components/schemas/TradeDetail' }
        preferences: { $ref: '#/components/schemas/Preferences' }
        withdrawalDetails:
          type: array
          items: { $ref: '#/components/schemas/WithdrawalDetail' }
    TaskFlowPayload:
      type: object
      additionalProperties: true
      properties:
        client_no: { type: string, description: "External client reference number. Stored as clientNo on the User record and used to link debt obligations." }
        spendl_product_type_id: { type: string }
        email: { type: string, format: email }
        email_secondary: { type: string }
        title: { type: string }
        name: { type: string }
        surname: { type: string }
        birth_date: { type: string }
        gender: { type: string }
        nationality_id: { type: string }
        preferred_language_id: { type: string }
        phone: { type: string }
        mobile: { type: string }
        contact_time: { type: string }
        residence_indicator: { type: string }
        residence_country_id: { type: string }
        identity_type: { type: string }
        id_number: { type: string }
        id_issue_date: { type: string }
        id_expiry_date: { type: string }
        identity_issue_country: { type: string }
        document_ids_front: { type: string }
        document_ids_back: { type: string }
        document_ids_passport: { type: string }
        permit_type: { type: string }
        permit_number: { type: string }
        permit_issue_date: { type: string }
        permit_expiry_date: { type: string }
        document_id_permit: { type: string }
        document_id_proof: { type: string }
        pep_pip_declaration: { oneOf: [ { type: boolean }, { type: string } ] }
        street: { type: string }
        street2: { type: string }
        street3: { type: string }
        suburb: { type: string }
        city_id: { type: string }
        state_id: { type: string }
        zip: { type: string }
        country_id: { type: string }
        address_type: { type: string }
        document_id_residence: { type: string }
        residence_status: { type: string }
        postal_address: { type: boolean }
        postal_street_line_1: { type: string }
        postal_street_line_2: { type: string }
        postal_street_line_3: { type: string }
        postal_city_id: { type: string }
        postal_zip: { type: string }
        postal_country_id: { type: string }
        company_type: { type: string }
        employment_number: { type: string }
        employment_status: { type: string }
        spendl_source_of_funds_id: { type: string }
        spendl_account_purpose: { type: string }
        accept_terms_and_conditions: { type: string }
      example:
        spendl_product_type_id: "SPENDL-001"
        email: "john.vanderberg@example.com"
        email_secondary: "john.backup@example.com"
        title: "Mr"
        name: "John"
        surname: "Van Der Berg"
        birth_date: "1990-01-01"
        gender: "Male"
        nationality_id: "ZA"
        preferred_language_id: "EN"
        phone: "+27110001234"
        mobile: "+27821234567"
        contact_time: "09h00"
        residence_indicator: "Permanent"
        residence_country_id: "ZA"
        identity_type: "RSA ID"
        id_number: "9001015009087"
        id_issue_date: "2008-01-15"
        identity_issue_country: "ZA"
        pep_pip_declaration: false
        street: "42 Long Street"
        street2: "Unit 5"
        suburb: "Gardens"
        city_id: "Cape Town"
        state_id: "Western Cape"
        zip: "8001"
        country_id: "ZA"
        address_type: "Residential"
        residence_status: "Owner"
        postal_address: false
        company_type: "Private Company"
        employment_number: "EMP001"
        employment_status: "Employed"
        spendl_source_of_funds_id: "Salary"
        spendl_account_purpose: "Savings and Investments"
        accept_terms_and_conditions: "2026-01-29T10:00:00Z"
    IngestData:
      oneOf:
        - $ref: '#/components/schemas/UserInput'
        - $ref: '#/components/schemas/TaskFlowPayload'
    IngestRequest:
      oneOf:
        - type: object
          properties:
            data: { $ref: '#/components/schemas/IngestData' }
          required: [data]
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/IngestData' }
          required: [data]
    SingleInsertResult:
      type: object
      required: [success, user]
      properties:
        success: { type: boolean, enum: [true] }
        user: { $ref: '#/components/schemas/User' }
    BatchInsertResult:
      type: object
      required: [inserted, insertedCount, failed, failedCount]
      properties:
        inserted:
          type: array
          items: { $ref: '#/components/schemas/User' }
        insertedCount: { type: integer }
        failed:
          type: array
          items:
            type: object
            properties:
              record: { $ref: '#/components/schemas/UserInput' }
              email: { type: string }
              reason: { type: string, enum: [DUPLICATE_EMAIL, VALIDATION_ERROR, UNKNOWN_ERROR] }
        failedCount: { type: integer }
    ValidationResponse:
      type: object
      required: [valid, errors]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items:
            type: object
            properties:
              email: { type: string }
              errors:
                type: array
                items: { type: string }
    KycUploadResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean, enum: [true] }
    DocumentType:
      type: string
      enum: [idProofFront, idProofBack, passportProof, permitProof, proofOfResidence]
      description: |
        Type of KYC document:
        - idProofFront: Front of ID card (category: ID)
        - idProofBack: Back of ID card (category: ID)
        - passportProof: Passport photo page (category: ID)
        - permitProof: Work/residence permit (category: ID)
        - proofOfResidence: Utility bill, bank statement, etc. (category: POR)
    DocumentCategory:
      type: string
      enum: [ID, POR]
      description: |
        Document category:
        - ID: Identity documents (idProofFront, idProofBack, passportProof, permitProof)
        - POR: Proof of residence (proofOfResidence)
    TaskFlowDebtPayload:
      type: object
      required: [guid, machine, client_no, loan_ref_no, first_dt, date_adj, frequency, track_cd, total_amt, inst_amt, status, account_type, bank_acc_no, bank_branch_cd, pmt_stream, allow_tracking, allow_date_chg, allow_max_inst, allow_any_cell_no, allow_scheduling, mode, wait_response, api_callback]
      properties:
        guid: { type: string, description: Unique identifier for the debt obligation }
        machine: { type: string, description: Originating machine identifier }
        client_no: { type: string, description: Client reference number (must match an existing user's clientNo) }
        loan_ref_no: { type: string, description: Loan reference number }
        first_dt: { type: string, description: "First payment date in YYYYMMDD format" }
        date_adj: { type: integer, description: Date adjustment value }
        frequency: { type: integer, description: Payment frequency code }
        track_cd: { type: string, description: Tracking code }
        total_amt: { type: integer, description: Total amount in cents }
        inst_amt: { type: integer, description: Instalment amount in cents }
        status: { type: string, description: Obligation status }
        account_type: { type: integer, description: Bank account type }
        bank_acc_no: { type: string, description: Bank account number }
        bank_branch_cd: { type: string, description: Bank branch code }
        pmt_stream: { type: string, description: Payment stream identifier }
        inst_adj_amt: { type: integer, description: Instalment adjustment amount, default: 0 }
        inst_adj_rate: { type: integer, description: Instalment adjustment rate, default: 0 }
        allow_tracking: { type: string, enum: ["T", "F"], description: Allow tracking flag }
        allow_date_chg: { type: string, enum: ["T", "F"], description: Allow date change flag }
        allow_max_inst: { type: string, enum: ["T", "F"], description: Allow max instalment flag }
        allow_any_cell_no: { type: string, enum: ["T", "F"], description: Allow any cell number flag }
        allow_scheduling: { type: string, enum: ["T", "F"], description: Allow scheduling flag }
        mode: { type: string, description: Processing mode (e.g. Realtime) }
        wait_response: { type: string, enum: ["T", "F"], description: Wait for response flag }
        api_callback: { type: string, format: uri, description: "HTTPS callback URL. The hostname must be in the configured callback allowlist (TASKFLOW_CALLBACK_ALLOWLIST); non-allowlisted hosts are rejected with HTTP 422." }
      example:
        guid: "7D9B408607114EA288FD0F5CD629EB6F"
        machine: "WINDOWS-PC"
        client_no: "00000000240247"
        loan_ref_no: "176412_92129"
        first_dt: "20260331"
        date_adj: 4
        frequency: 2
        track_cd: "03"
        total_amt: 1302332
        inst_amt: 15000
        status: "0"
        account_type: 0
        bank_acc_no: "2055177865"
        bank_branch_cd: "470010"
        pmt_stream: "ACOL"
        inst_adj_amt: 0
        inst_adj_rate: 0
        allow_tracking: "T"
        allow_date_chg: "T"
        allow_max_inst: "F"
        allow_any_cell_no: "T"
        allow_scheduling: "T"
        mode: "Realtime"
        wait_response: "F"
        api_callback: "https://bridge.taskflow.co.za/amplifin/response"
    DebtObligationRequest:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TaskFlowDebtPayload'
    DebtObligation:
      type: object
      properties:
        _id: { type: string }
        guid: { type: string }
        machine: { type: string }
        clientNo: { type: string }
        loanRefNo: { type: string }
        firstDt: { type: string }
        dateAdj: { type: integer }
        frequency: { type: integer }
        trackCd: { type: string }
        totalAmt: { type: integer }
        instAmt: { type: integer }
        status: { type: string }
        accountType: { type: integer }
        bankAccNo: { type: string }
        bankBranchCd: { type: string }
        pmtStream: { type: string }
        instAdjAmt: { type: integer }
        instAdjRate: { type: integer }
        allowTracking: { type: boolean }
        allowDateChg: { type: boolean }
        allowMaxInst: { type: boolean }
        allowAnyCellNo: { type: boolean }
        allowScheduling: { type: boolean }
        mode: { type: string }
        waitResponse: { type: boolean }
        apiCallback: { type: string }
        userId: { type: string, description: MongoDB ObjectId of the linked user }
        processingStatus:
          type: string
          enum: [pending, forwarded, callback_sent, callback_failed, failed]
          description: Current processing state of the obligation
        replyCd: { type: string, nullable: true, description: Reply code from processing }
        replyStr: { type: string, nullable: true, description: Reply message from processing }
        backendResponse: { type: object, nullable: true, description: Raw response from Spendl backend }
        errorMessage: { type: string, nullable: true }
        callbackSentAt: { type: string, format: date-time, nullable: true }
        createdByApiKeyId: { type: string }
        createdByTenant: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DebtIngestResponse:
      type: object
      required: [success, obligation]
      properties:
        success: { type: boolean, enum: [true] }
        obligation: { $ref: '#/components/schemas/DebtObligation' }
    DebtStatusResponse:
      type: object
      required: [obligation]
      properties:
        obligation: { $ref: '#/components/schemas/DebtObligation' }
    TaskFlowDebtCallback:
      type: object
      description: Callback payload sent to TaskFlow's api_callback URL after processing
      properties:
        guid: { type: string }
        machine: { type: string }
        client_no: { type: string }
        loan_ref_no: { type: string }
        first_dt: { type: string }
        date_adj: { type: integer }
        frequency: { type: integer }
        track_cd: { type: string }
        total_amt: { type: integer }
        inst_amt: { type: integer }
        status: { type: string }
        account_type: { type: integer }
        bank_acc_no: { type: string }
        bank_branch_cd: { type: string }
        pmt_stream: { type: string }
        inst_adj_amt: { type: integer }
        inst_adj_rate: { type: integer }
        allow_tracking: { type: string }
        allow_date_chg: { type: string }
        allow_max_inst: { type: string }
        allow_any_cell_no: { type: string }
        allow_scheduling: { type: string }
        mode: { type: string }
        wait_response: { type: string }
        api_callback: { type: string }
        reply_cd: { type: string, description: Reply code (e.g. 207 for success) }
        reply_str: { type: string, description: Reply message (e.g. Successful) }
      example:
        guid: "7D9B408607114EA288FD0F5CD629EB6F"
        machine: "WINDOWS-PC"
        client_no: "9011290136082"
        loan_ref_no: "171407_92133"
        first_dt: "20260227"
        date_adj: 4
        frequency: 2
        track_cd: "05"
        total_amt: 1833812
        inst_amt: 50000
        status: "0"
        account_type: 1
        bank_acc_no: "19781693377"
        bank_branch_cd: "679000"
        pmt_stream: "ACOL"
        inst_adj_amt: 0
        inst_adj_rate: 0
        allow_tracking: "T"
        allow_date_chg: "T"
        allow_max_inst: "F"
        allow_any_cell_no: "T"
        allow_scheduling: "T"
        mode: "Realtime"
        wait_response: "F"
        api_callback: "https://bridge.taskflow.co.za/amplifin/response"
        reply_cd: "207"
        reply_str: "Successful"
paths:
  /auth/token:
    post:
      tags: [Auth]
      summary: Exchange API key/secret for JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
