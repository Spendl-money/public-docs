  /api/kyc/{userId}/{documentType}/{category}/{filename}:
    post:
      tags: [KYC]
      summary: Upload KYC document for a user
      description: |
        Upload a KYC document (ID card, passport, proof of residence, etc.) for an existing user.
        The file is converted to PDF and stored in S3. The S3 path is saved to the user's record.
        
        Category validation:
        - proofOfResidence requires category "POR"
        - All other document types require category "ID"
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: MongoDB ObjectId of the user
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
        - name: documentType
          in: path
          required: true
          description: Type of document being uploaded
          schema:
            $ref: '#/components/schemas/DocumentType'
        - name: category
          in: path
          required: true
          description: Document category (must match documentType)
          schema:
            $ref: '#/components/schemas/DocumentCategory'
        - name: filename
          in: path
          required: true
          description: Original filename
          schema:
            type: string
            example: "drivers-license.jpg"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    The document file. Supported types:
                    - image/jpeg
                    - image/png
                    - application/pdf
                    
                    Maximum size: 10MB
      responses:
        '200':
          description: Document uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycUploadResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: File too large (exceeds 10MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation error (invalid documentType, category mismatch, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/debt/ingest:
    post:
      tags: [Debt]
      description: |
        Accepts a debt obligation payload from TaskFlow, resolves the client_no to an existing user,
        persists the record, forwards it to the Spendl backend, and sends a callback to TaskFlow's
        api_callback URL. Processing is synchronous.
        
        Flow: validate → dedup check (guid) → lookup user (client_no) → persist → forward to Spendl backend → callback to TaskFlow → respond
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebtObligationRequest'
            examples:
              debtObligation:
                summary: TaskFlow debt obligation payload
                value:
                  data:
                    guid: "7D9B408607114EA288FD0F5CD629EB6F"
                    machine: "WINDOWS-PC"
                    client_no: "00000000240247"
                    loan_ref_no: "176412_92129"
                    first_dt: "20260331"
                    date_adj: 4
                    frequency: 2
                    track_cd: "03"
                    total_amt: 1302332
                    inst_amt: 15000
                    status: "0"
                    account_type: 0
                    bank_acc_no: "2055177865"
                    bank_branch_cd: "470010"
                    pmt_stream: "ACOL"
                    inst_adj_amt: 0
                    inst_adj_rate: 0
                    allow_tracking: "T"
                    allow_date_chg: "T"
                    allow_max_inst: "F"
                    allow_any_cell_no: "T"
                    allow_scheduling: "T"
                    mode: "Realtime"
                    wait_response: "F"
                    api_callback: "https://bridge.taskflow.co.za/amplifin/response"
      responses:
        '200':
          description: Debt obligation successfully processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtIngestResponse'
              examples:
                success:
                  summary: Successful debt obligation ingestion
                  value:
                    success: true
                    obligation:
                      _id: "507f1f77bcf86cd799439011"
                      guid: "7D9B408607114EA288FD0F5CD629EB6F"
                      clientNo: "00000000240247"
                      loanRefNo: "176412_92129"
                      firstDt: "20260331"
                      totalAmt: 1302332
                      instAmt: 15000
                      processingStatus: "callback_sent"
                      replyCd: "207"
                      replyStr: "Successful"
                      userId: "507f1f77bcf86cd799439022"
                      createdByApiKeyId: "id_abc123def456"
                      createdByTenant: "Partner Corp"
                      createdAt: "2026-02-24T10:00:00Z"
                      updatedAt: "2026-02-24T10:00:01Z"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: User not found (no user with matching client_no)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                userNotFound:
                  value:
                    error:
                      message: "No user found with clientNo '00000000240247'"
                      code: 404
                      type: "USER_NOT_FOUND"
        '409':
          description: Duplicate guid (obligation already processed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                duplicateGuid:
                  value:
                    error:
                      message: "Debt obligation with guid '7D9B408607114EA288FD0F5CD629EB6F' already exists"
                      code: 409
                      type: "DUPLICATE_GUID"
        '422':
          description: Validation error (missing required fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                missingFields:
                  value:
                    error:
                      message: "Missing required fields: guid, client_no"
                      code: 422
                      type: "VALIDATION_ERROR"
        '502':
          description: Backend or callback error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                backendError:
                  value:
                    error:
                      message: "Failed to forward debt obligation to backend: Connection refused"
                      code: 502
                      type: "BACKEND_FORWARD_ERROR"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
